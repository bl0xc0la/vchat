<!DOCTYPE html>
<html>
<head>
<title>VChat</title>

<style>
body {
  margin:0;
  font-family:Arial;
  display:flex;
  height:100vh;
  background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:white;
}

/* SERVERS */
#servers {
  width:80px;
  background:rgba(0,0,0,0.4);
  backdrop-filter:blur(10px);
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:10px;
  gap:10px;
}

.server {
  width:50px;height:50px;
  border-radius:15px;
  background:linear-gradient(45deg,#5865f2,#7b8cff);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 5px 15px rgba(0,0,0,0.6);
}

/* CHANNELS */
#channels {
  width:220px;
  background:rgba(0,0,0,0.3);
  backdrop-filter:blur(10px);
  padding:10px;
}

.channel {
  padding:10px;
  border-radius:10px;
  cursor:pointer;
  margin-bottom:5px;
  transition:0.2s;
}
.channel:hover {
  background:rgba(255,255,255,0.1);
}

/* MAIN */
#main {
  flex:1;
  display:flex;
  flex-direction:column;
}

/* TOP */
#topbar {
  padding:10px;
  background:rgba(0,0,0,0.3);
  backdrop-filter:blur(10px);
  display:flex;
  justify-content:space-between;
}

/* MESSAGES */
#messages {
  flex:1;
  overflow-y:auto;
  padding:15px;
}

.msg {
  display:flex;
  gap:10px;
  margin-bottom:10px;
}

.msg-content {
  background:rgba(0,0,0,0.4);
  padding:10px;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.5);
}

/* INPUT */
#form {
  display:flex;
  padding:10px;
  gap:10px;
}

input {
  flex:1;
  padding:12px;
  border:none;
  border-radius:12px;
  background:rgba(0,0,0,0.4);
  color:white;
}

button {
  padding:12px;
  border:none;
  border-radius:12px;
  background:linear-gradient(45deg,#5865f2,#7b8cff);
  color:white;
}

/* AUTH */
#auth, #profile {
  position:absolute;
  top:0;left:0;right:0;bottom:0;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#000;
}

.card {
  background:rgba(0,0,0,0.6);
  padding:25px;
  border-radius:15px;
  box-shadow:0 10px 30px rgba(0,0,0,0.7);
  display:flex;
  flex-direction:column;
  gap:10px;
}
</style>
</head>

<body>

<div id="auth">
  <div class="card">
    <h3>VChat Login</h3>
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button onclick="signup()">Sign Up</button>
    <button onclick="login()">Login</button>
  </div>
</div>

<div id="profile" style="display:none;">
  <div class="card">
    <h3>Create Profile</h3>
    <input id="username">
    <input id="pfp" placeholder="PFP URL">
    <button onclick="saveProfile()">Continue</button>
  </div>
</div>

<div id="servers">
  <div class="server">V</div>
</div>

<div id="channels"></div>

<div id="main">
  <div id="topbar">
    <span>VChat</span>
    <span id="onlineCount">0 online</span>
  </div>

  <div id="messages"></div>

  <form id="form">
    <input id="input" placeholder="Message...">
    <button>Send</button>
  </form>
</div>

<script src="app.js"></script>
</body>
</html>
